name: PiriRuntimeVault
version: '${version}'
main: jp.pirijuggler.runtime.vault.TestVaultPlugin
api-version: '1.21'
loadbefore: [PiriJuggler]
description: Test-only Vault Economy provider for Piri Juggler runtime acceptance
commands:
  testvault:
    description: Set or inspect the runtime acceptance Vault balance and simulate deposit failure
    usage: /testvault set [player] <amount> | /testvault get [player] | /testvault faildeposit <on|off>
    permission: piri.runtime
permissions:
  piri.runtime:
    default: op
