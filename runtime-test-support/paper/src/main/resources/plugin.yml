name: PiriRuntimeAcceptance
version: '${version}'
main: jp.pirijuggler.runtime.paper.RuntimeObserver
api-version: '1.21'
depend: [PiriJuggler]
commands:
  piritest:
    description: Piri Juggler runtime acceptance helper
    usage: /piritest fund [player] | /piritest force <big|reg|A|B|C|D|E|F> [player] | /piritest clear
    permission: piri.runtime
  piribalance:
    description: Set an exact Phase07 runtime session balance
    usage: /piribalance <credit 0..50> <held >=0> [player]
    permission: piri.runtime
  pirireset:
    description: Reset an unsettled runtime-test game snapshot while preserving CREDIT and held medals
    usage: /pirireset [player]
    permission: piri.runtime
permissions:
  piri.runtime:
    default: op
