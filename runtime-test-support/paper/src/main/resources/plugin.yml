name: PiriRuntimeAcceptance
version: '${version}'
main: jp.pirijuggler.runtime.paper.RuntimeObserver
api-version: '1.21'
depend: [PiriJuggler]
commands:
  piritest:
    description: Piri Juggler runtime acceptance helper
    usage: /piritest fund [player] | /piritest force <big|reg|A|B|C|D|E|F> [player] | /piritest clear
    permission: piri.runtime
  piribalance:
    description: Set an exact Phase07 runtime session balance
    usage: /piribalance <credit 0..50> <held >=0> [player]
    permission: piri.runtime
  pirifault:
    description: Phase07 medal LEDGER_COMMITTED crash/reconciliation fault injection
    usage: /pirifault <before|after|status> [player]
    permission: piri.runtime
  pirivaultfault:
    description: Phase08 test-only Vault failure and unknown-outcome injection using the real economy provider
    usage: /pirivaultfault <on|off|status> | /pirivaultfault uncertain <on|off|status>
    permission: piri.runtime
  pirisecurity:
    description: Phase11 duplicate/stale sequence and fake-session negative runtime test
    usage: /pirisecurity
    permission: piri.runtime
permissions:
  piri.runtime:
    default: op
