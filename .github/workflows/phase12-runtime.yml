name: Phase12 real runtime

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  phase12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless OpenGL display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          chmod +x gradlew
      - name: Build production and runtime helpers
        run: |
          ./gradlew :fabric:remapJar :paper:jar --console=plain
          ./gradlew -PruntimeAcceptance=true :runtime-test-paper:jar :runtime-test-client:remapJar :runtime-test-vault:jar --console=plain
      - name: Download verified Paper 1.21 build 130
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-evidence/PHASE_01/work/downloads | Out-Null
          $headers=@{"User-Agent"="PiriJuggler-runtime-tests/1.0 (https://github.com/Pasta0719/PiriJuggler)"}
          $builds=Invoke-RestMethod -Headers $headers -Uri "https://fill.papermc.io/v3/projects/paper/versions/1.21/builds"
          $build=$builds | Where-Object { $_.id -eq 130 } | Select-Object -First 1
          if ($null -eq $build) { throw "Paper 1.21 build 130 missing from v3 downloads service" }
          $url=$build.downloads.'server:default'.url
          if ([string]::IsNullOrWhiteSpace($url)) { throw "Paper build 130 server download URL missing" }
          Invoke-WebRequest -Headers $headers -Uri $url -OutFile "runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar"
          $actual=(Get-FileHash "runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne "ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5") { throw "Paper SHA256 mismatch: $actual" }
      - name: Real Paper + two Fabric clients under Xvfb
        run: xvfb-run -a -s "-screen 0 1280x720x24" python runtime-test-support/run_phase12.py
      - name: Upload Phase12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-runtime-evidence
          path: |
            runtime-evidence/PHASE_12/REPORT.md
            runtime-evidence/PHASE_12/result.json
            runtime-evidence/PHASE_12/attempts/**
