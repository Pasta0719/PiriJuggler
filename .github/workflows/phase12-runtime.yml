name: Phase12 real runtime

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  phase12:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production tests and jars
        shell: cmd
        run: gradlew.bat test packagePiriJars --console=plain
      - name: Runtime helper
        shell: cmd
        run: build-runtime-test-helper.bat --no-pause
      - name: Download verified Paper 1.21 build 130
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-evidence/PHASE_01/work/downloads | Out-Null
          Invoke-WebRequest -Uri "https://api.papermc.io/v2/projects/paper/versions/1.21/builds/130/downloads/paper-1.21-130.jar" -OutFile "runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar"
          $actual=(Get-FileHash "runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne "ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5") { throw "Paper SHA256 mismatch: $actual" }
      - name: Real Paper + two Fabric clients
        shell: cmd
        run: python runtime-test-support\run_phase12.py
      - name: Upload Phase12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-runtime-evidence
          path: |
            runtime-evidence/PHASE_12/REPORT.md
            runtime-evidence/PHASE_12/result.json
            runtime-evidence/PHASE_12/attempts/**
