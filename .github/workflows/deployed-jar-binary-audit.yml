name: Audit deployed JAR binary identity

on:
  push:
    branches: [ audit/deployed-jar-identity-20261111 ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Paper and Fabric without modifying the mandatory release gate
        run: bash gradlew :paper:jar :fabric:remapJar --console=plain
      - name: Compare generated JAR contents with currently deployed pair
        run: |
          python scripts/audit_deployed_binary_identity.py \
            paper/build/libs/piri-juggler-paper-1.0.0.jar \
            fabric/build/libs/piri-juggler-fabric-1.0.0.jar \
            audit-output
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-jar-content-manifests
          path: audit-output/
