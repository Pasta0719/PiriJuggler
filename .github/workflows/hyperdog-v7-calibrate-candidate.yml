name: HYPER_DOG v7 upper 4000 feasibility and setting calibration
on:
  push:
    branches: [plan/original-at-machine-20261107]
    paths:
      - 'original-at-phases/reference/piri_calibrate_v7_role085.py'
      - '.github/workflows/hyperdog-v7-calibrate-candidate.yml'
  workflow_dispatch:
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'numba>=0.60,<0.67'
      - name: Search setting multipliers and check independent return
        run: python -u original-at-phases/reference/piri_calibrate_v7_role085.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyperdog-v7-4k-candidate-only
          path: runtime-evidence/HYPER_DOG_V7_4K_CANDIDATE/**
