name: One-shot royal gold atlas commit
on:
  push:
    branches: [fix/royal-gold-hint-atlas]
    paths:
      - '.github/workflows/royal-gold-one-shot.yml'
permissions:
  contents: write
jobs:
  write-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch only GOLD frame
        run: java tools/PatchRoyalGoldHint.java
      - name: Commit modified PNG to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fabric/src/main/resources/assets/piri/textures/juggler_god/lamp/setting_hint_atlas.png
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Update GOLD setting hint frame to Royal Gold A (YELLOW unchanged)"
          git push origin HEAD:fix/royal-gold-hint-atlas
