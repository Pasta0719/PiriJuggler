name: Pachinko Phase 10 real runtime

concurrency:
  group: pachinko-phase10-real-runtime
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'PACHINKO_PHASES.md'
      - 'paper/**'
      - 'fabric/**'
      - 'common/**'
      - 'runtime-test-support/**'
      - '.github/workflows/pachinko-phase10-runtime.yml'

jobs:
  pachinko-phase10:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare headless OpenGL display
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
          chmod +x gradlew
      - name: Build production jars and run all regressions
        run: |
          ./gradlew --parallel --build-cache \
            :common:test :paper:test :fabric:test :common:jar :paper:jar :fabric:remapJar --console=plain
      - name: Build pachinko runtime helpers
        run: |
          ./gradlew --parallel --build-cache \
            -PruntimeAcceptance=true -PruntimeScenario=pachinko10-owner -PruntimeEvidencePhase=PACHINKO_PHASE_10 \
            :runtime-test-paper:jar :runtime-test-client:remapJar --console=plain
      - name: Cache verified Paper 1.21 build 130
        uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Ensure verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Real Paper + two Fabric pachinko Phase10 acceptance
        run: xvfb-run -a -s "-screen 0 1280x720x24" python runtime-test-support/run_pachinko_phase10.py
      - name: Upload pachinko Phase10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pachinko-phase10-runtime-evidence
          path: |
            runtime-evidence/PACHINKO_PHASE_10/REPORT.md
            runtime-evidence/PACHINKO_PHASE_10/result.json
            runtime-evidence/PACHINKO_PHASE_10/attempts/**
            common/build/test-results/**
            paper/build/test-results/**
            fabric/build/test-results/**
            paper/build/libs/piri-juggler-paper-1.0.0.jar
            fabric/build/libs/piri-juggler-fabric-1.0.0.jar
