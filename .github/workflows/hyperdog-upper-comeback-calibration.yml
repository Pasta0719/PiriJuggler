name: HYPER_DOG upper comeback initial-hit calibration
on:
  push:
    branches: [plan/original-at-machine-20261107]
    paths:
      - 'original-at-phases/reference/piri_simulate_full_v1.py'
      - 'original-at-phases/reference/calibrate_upper_comeback.py'
      - '.github/workflows/hyperdog-upper-comeback-calibration.yml'
  workflow_dispatch:
jobs:
  upper-comeback-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact simulation dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'numba>=0.60,<0.67'
      - name: Simulate and fit upper comeback using approved payout targets
        run: |
          python -u original-at-phases/reference/calibrate_upper_comeback.py \
            --coarse-paid 1200000 --verify-paid 6000000 --iterations 9
      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperdog-upper-comeback-calibration
          path: runtime-evidence/HYPER_DOG_CALIBRATION/**
