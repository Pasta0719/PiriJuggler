name: HYPER_DOG upper-origin comeback v6 payout verification
on:
  push:
    branches: [plan/original-at-machine-20261107]
    paths:
      - 'original-at-phases/reference/piri_simulate_upper_comeback_v6.py'
      - 'original-at-phases/reference/verify_upper_comeback_v6.py'
      - 'original-at-phases/reference/pirijuggler_new_machine_calibrated_v6.json'
      - '.github/workflows/hyperdog-upper-comeback-calibration.yml'
  workflow_dispatch:
jobs:
  verify-v6-return-and-initial-hit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'numpy>=1.26,<3' 'numba>=0.60,<0.67'
      - name: Independent 240 million paid games per setting across two seeds
        run: |
          python -u original-at-phases/reference/verify_upper_comeback_v6.py 120000000
      - name: Archive all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperdog-v6-upper-origin-comeback-payout
          path: runtime-evidence/HYPER_DOG_V6_CALIBRATION/**
