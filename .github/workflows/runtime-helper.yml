name: Runtime helper build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build production Fabric jar prerequisite
        shell: cmd
        run: gradlew.bat :fabric:remapJar --console=plain
      - name: Build runtime helper
        shell: cmd
        run: build-runtime-test-helper.bat --no-pause
      - name: Validate GOD Phase 2 runtime configuration
        shell: cmd
        run: gradlew.bat -PruntimeAcceptance=true -PruntimeScenario=god02-main -PruntimeEvidencePhase=GOD_PHASE_02 :runtime-test-client:build :runtime-test-paper:build --console=plain
      - name: Validate GOD Phase 2 runner syntax
        shell: cmd
        run: py -m py_compile runtime-test-support\run_god_phase02.py
