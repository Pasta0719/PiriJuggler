name: HYPER_DOG Phase 07 ledger, data-lamp and real Paper restart acceptance

on:
  push:
    branches: [ plan/original-at-machine-20261107 ]
    paths:
      - 'paper/src/main/java/jp/pirijuggler/paper/game/hyperdog/**'
      - 'paper/src/main/java/jp/pirijuggler/paper/data/**'
      - 'paper/src/main/java/jp/pirijuggler/paper/admin/**'
      - 'paper/src/main/java/jp/pirijuggler/paper/mobile/**'
      - 'paper/src/main/java/jp/pirijuggler/paper/machine/**'
      - 'paper/src/test/java/jp/pirijuggler/paper/game/hyperdog/**'
      - 'paper/src/test/java/jp/pirijuggler/paper/phase07/**'
      - 'fabric/src/main/java/jp/pirijuggler/fabric/network/**'
      - 'fabric/src/test/java/jp/pirijuggler/fabric/network/**'
      - 'runtime-test-support/**'
      - '.github/workflows/hyperdog-phase07-runtime.yml'
  workflow_dispatch:

concurrency:
  group: hyperdog-phase07-ledger-real-runtime
  cancel-in-progress: true

jobs:
  phase07-live-fabric-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real Minecraft Xvfb
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
          chmod +x gradlew
      - name: Build production Paper/Fabric JARs without runtime-test Loom injection
        run: |
          ./gradlew --parallel --build-cache :common:jar :paper:jar :fabric:remapJar --console=plain
      - name: Compile Paper and Fabric acceptance helpers against the existing remapped Fabric JAR
        run: |
          ./gradlew --build-cache -PruntimeAcceptance=true \
            -PruntimeEvidencePhase=HYPER_DOG_PHASE_07 \
            :runtime-test-paper:jar :runtime-test-client:remapJar --console=plain
      - uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Obtain verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Actual two Fabric viewers plus authenticated mobile HTTP against live HYPER_DOG
        run: |
          xvfb-run -a -s "-screen 0 1366x900x24" python runtime-test-support/run_hyperdog_phase07_live.py
      - name: Report factual Phase07 live result
        if: always()
        run: |
          python runtime-test-support/hyperdog_acceptance_diagnostics.py summarize HYPER_DOG_PHASE_07 "$GITHUB_STEP_SUMMARY"
      - name: Archive live snapshots, screenshots and mobile HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperdog-phase07-two-fabric-mobile-live
          path: |
            runtime-evidence/HYPER_DOG_PHASE_07/attempts/**
            runtime-evidence/HYPER_DOG_PHASE_07/screenshots/**
            runtime-evidence/HYPER_DOG_PHASE_07/REPORT.md

  phase07-ledger-two-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Java and verified Paper test environment
        run: chmod +x gradlew
      - name: Validate production mobile JavaScript and HYPER_DOG three-counter UI
        run: python runtime-test-support/verify_hyperdog_phase07_mobile.py
      # Fast Phase07 gate: run only tests tied to new machine integration.
      # Full old-machine regression + remapped Fabric build is retained in the
      # independent Piri build and Phase02-06 CI; do not repeat it in this job.
      - name: Focused Paper Phase07 ledger, economy, admin and mobile tests
        run: |
          ./gradlew --build-cache :paper:test \
            --tests 'jp.pirijuggler.paper.game.hyperdog.*' \
            --tests 'jp.pirijuggler.paper.phase07.*' \
            --tests 'jp.pirijuggler.paper.data.HyperDogDataLampTest' \
            --tests 'jp.pirijuggler.paper.admin.AdminStoreTest' \
            --tests 'jp.pirijuggler.paper.mobile.MobileRemotePageParityTest' \
            --tests 'jp.pirijuggler.paper.machine.RemoteMachineSyncTest' \
            :paper:jar --console=plain
      - name: Focused Fabric Phase07 world view and audio compatibility tests
        run: |
          ./gradlew --build-cache :fabric:test \
            --tests 'jp.pirijuggler.fabric.network.RemoteMachineRegistryTest' \
            --tests 'jp.pirijuggler.fabric.network.RemoteMachineViewStateTest' \
            --tests 'jp.pirijuggler.fabric.ui.HyperDogAudioTest' \
            --tests 'jp.pirijuggler.fabric.ui.HallAudioTest' \
            --tests 'jp.pirijuggler.fabric.ui.HyperDogCabinetStateTest' \
            --tests 'jp.pirijuggler.fabric.ui.HyperDogSymbolAssetsTest' \
            :fabric:remapJar --console=plain
      - name: Build isolated real Paper acceptance plugin
        run: |
          ./gradlew --build-cache -PruntimeAcceptance=true \
            :runtime-test-paper:jar --console=plain
      - uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Obtain verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Actual two separate Paper JVMs, protected BAR third-stop, first-hit/upper ledger
        run: python runtime-test-support/run_hyperdog_phase07_restart.py
      - name: Report factual check results
        if: always()
        run: |
          python runtime-test-support/hyperdog_acceptance_diagnostics.py summarize HYPER_DOG_PHASE_07 "$GITHUB_STEP_SUMMARY"
      - name: Archive logs, isolated SQLite, boot evidence and regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperdog-phase07-ledger-two-jvm
          path: |
            runtime-evidence/HYPER_DOG_PHASE_07/attempts/**
            paper/build/test-results/**
            fabric/build/test-results/**
            common/build/test-results/**
