name: Mobile real E2E

concurrency:
  group: mobile-real-e2e
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper/src/main/java/jp/pirijuggler/paper/mobile/**'
      - 'paper/src/main/java/jp/pirijuggler/paper/machine/MachineService.java'
      - 'paper/src/main/java/jp/pirijuggler/paper/economy/**'
      - 'paper/src/main/java/jp/pirijuggler/paper/PiriJugglerPlugin.java'
      - 'runtime-test-support/run_mobile_e2e.py'
      - 'runtime-test-support/paper/**'
      - 'runtime-test-support/client/**'
      - 'runtime-test-support/vault/**'
      - '.github/workflows/mobile-e2e-runtime.yml'

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          chmod +x gradlew
      - name: Build production and runtime helpers
        run: |
          ./gradlew --parallel --build-cache :common:jar :paper:jar :fabric:remapJar --console=plain
          ./gradlew --parallel --build-cache -PruntimeAcceptance=true -PruntimeScenario=mobile-e2e -PruntimeEvidencePhase=MOBILE_E2E :runtime-test-paper:jar :runtime-test-client:remapJar :runtime-test-vault:jar --console=plain
      - name: Cache verified Paper 1.21 build 130
        uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Ensure verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Download pinned Vault 1.7.3
        run: |
          mkdir -p runtime-evidence/MOBILE_E2E/work/downloads
          curl --fail --location --retry 3 https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar -o runtime-evidence/MOBILE_E2E/work/downloads/Vault.jar
      - name: Real Minecraft + mobile HTTP economy acceptance
        run: xvfb-run -a -s "-screen 0 1280x720x24" python runtime-test-support/run_mobile_e2e.py
      - name: Upload mobile E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-runtime-evidence
          path: |
            runtime-evidence/MOBILE_E2E/result.json
            runtime-evidence/MOBILE_E2E/attempts/**
