name: Phase13 world cabinet runtime

on:
  push:
    branches: [ main ]
    paths:
      - 'fabric/**'
      - 'paper/**'
      - 'common/**'
      - 'runtime-test-support/**'
      - '.github/workflows/phase13-runtime.yml'
  workflow_dispatch:

jobs:
  phase13:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Build production and runtime helpers
        run: ./gradlew test build :runtime-test-paper:build :runtime-test-client:build --console=plain
      - name: Run Phase13 real runtime acceptance
        run: python runtime-test-support/run_phase13.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase13-runtime-evidence
          path: |
            runtime-evidence/PHASE_13/**
