name: NEXT Phase 02 real runtime

concurrency:
  group: next-phase02-real-runtime
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'paper/**'
      - 'fabric/**'
      - 'common/**'
      - 'runtime-test-support/**'
      - 'run-next-phase02-runtime.bat'
      - '.github/workflows/next-phase02-runtime.yml'
      - 'next-machine-phases/NEXT_PHASE_02_CORE_GAMEPLAY.md'

jobs:
  next-phase02:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless OpenGL display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          chmod +x gradlew
      - name: Build production and NEXT runtime helpers
        run: |
          ./gradlew test packagePiriJars --console=plain
          ./gradlew -PruntimeAcceptance=true -PruntimeScenario=next02-main -PruntimeEvidencePhase=NEXT_PHASE_02 :runtime-test-paper:build :runtime-test-client:build --console=plain
      - name: Download verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Real Paper + Fabric NEXT Phase 02 acceptance
        run: xvfb-run -a -s "-screen 0 1280x720x24" python runtime-test-support/run_next_phase02.py
      - name: Upload NEXT Phase 02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-phase02-runtime-evidence
          path: |
            runtime-evidence/NEXT_PHASE_02/result.json
            runtime-evidence/NEXT_PHASE_02/attempts/**
