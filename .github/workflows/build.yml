name: Piri build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runtime-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Production build and tests
        shell: cmd
        run: gradlew.bat test packagePiriJars --console=plain
      - name: Runtime test helper
        shell: cmd
        run: build-runtime-test-helper.bat --no-pause

      - name: Upload production jars
        uses: actions/upload-artifact@v4
        with:
          name: piri-juggler-production
          path: |
            dist/piri-juggler-paper-1.0.0.jar
            dist/piri-juggler-fabric-1.0.0.jar
