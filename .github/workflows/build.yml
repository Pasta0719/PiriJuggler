name: Piri build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Production test and jars
        shell: cmd
        run: gradlew.bat test packagePiriJars --console=plain
      - name: Runtime test helper
        shell: cmd
        run: build-runtime-test-helper.bat --no-pause
