name: HYPER_DOG Phase 05 Fabric cabinet real Paper/Fabric runtime

on:
  push:
    branches: [ plan/original-at-machine-20261107 ]
    paths:
      - 'fabric/src/main/java/jp/pirijuggler/fabric/ui/**'
      - 'fabric/src/main/java/jp/pirijuggler/fabric/PiriJugglerClient.java'
      - 'fabric/src/test/java/jp/pirijuggler/fabric/ui/**'
      - 'runtime-test-support/**'
      - '.github/workflows/hyperdog-phase05-runtime.yml'
  workflow_dispatch:

concurrency:
  group: hyperdog-phase05-real-runtime
  cancel-in-progress: true

jobs:
  phase05-cabinet:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable verified real headless Minecraft
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
          chmod +x gradlew
      - name: Full legacy and Phase05 unit/integration test and production jars
        run: |
          ./gradlew --parallel --build-cache test :common:jar :paper:jar :fabric:remapJar --console=plain
      - name: Build real Paper and Fabric probe JARs
        run: |
          ./gradlew --parallel --build-cache \
            -PruntimeAcceptance=true -PruntimeScenario=hyperdog05-main \
            -PruntimeEvidencePhase=HYPER_DOG_PHASE_05 \
            :runtime-test-paper:jar :runtime-test-client:remapJar --console=plain
      - uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Obtain verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Actual Paper/Fabric cabin UI, mouse/keyboard and all-aspect screenshots
        run: |
          xvfb-run -a -s "-screen 0 1366x900x24" python runtime-test-support/run_hyperdog_phase05.py
      - name: Report actual acceptance status
        if: always()
        run: |
          python runtime-test-support/hyperdog_acceptance_diagnostics.py summarize HYPER_DOG_PHASE_05 "$GITHUB_STEP_SUMMARY"
      - name: Archive real in-game screenshots, logs, source and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperdog-phase05-real-fabric-cabinet
          path: |
            runtime-evidence/HYPER_DOG_PHASE_05/**
            paper/build/test-results/**
            fabric/build/test-results/**
            common/build/test-results/**
