name: SKILL STOP Phase 06 final acceptance

concurrency:
  group: skill-stop-phase06-final
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ skill-stop-phase06 ]
    paths:
      - 'paper/**'
      - 'fabric/**'
      - 'common/**'
      - 'runtime-test-support/**'
      - 'skill-stop-phases/**'
      - 'run-skill-stop-phase06-runtime.bat'
      - '.github/workflows/skill-stop-phase06-runtime.yml'

jobs:
  skill-stop-phase06:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare headless OpenGL display
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
          chmod +x gradlew
      - name: Build production jars, vectors and runtime helpers
        run: |
          ./gradlew --parallel --build-cache \
            packagePiriJars :common:exportSkillStopPhase06Vectors \
            -PruntimeAcceptance=true -PruntimeScenario=skill06-main -PruntimeEvidencePhase=SKILL_STOP_PHASE_06 \
            :runtime-test-paper:jar :runtime-test-client:remapJar --console=plain
      - name: Cache verified Paper 1.21 build 130
        uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Ensure verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Real Paper + Fabric Phase06 final acceptance
        run: xvfb-run -a -s "-screen 0 1280x720x24" python runtime-test-support/run_skill_stop_phase06.py
      - name: Upload Phase06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-stop-phase06-final-evidence
          path: |
            runtime-evidence/SKILL_STOP_PHASE_06/result.json
            runtime-evidence/SKILL_STOP_PHASE_06/attempts/**
            build/skill-stop-phase06-vectors.json
            build/skill-stop-phase06-economy.json
            build/skill-stop-economy-analysis.json
            common/build/test-results/**
            paper/build/test-results/**
            fabric/build/test-results/**
            paper/build/libs/piri-juggler-paper-1.0.0.jar
            fabric/build/libs/piri-juggler-fabric-1.0.0.jar
