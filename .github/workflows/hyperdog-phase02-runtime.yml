name: HYPER_DOG Phase 02 Paper/Fabric real runtime

on:
  push:
    branches: [ plan/original-at-machine-20261107 ]
    paths:
      - 'common/**'
      - 'paper/**'
      - 'fabric/**'
      - 'runtime-test-support/**'
      - '.github/workflows/hyperdog-phase02-runtime.yml'
  workflow_dispatch:

concurrency:
  group: hyperdog-phase02-real-runtime
  cancel-in-progress: true

jobs:
  phase02-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Linux headless OpenGL
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
          chmod +x gradlew
      - name: Verify current v2 strip independently from the Java solver
        run: python original-at-phases/validate_reels.py
      - name: Build real production code and all regression tests
        run: |
          ./gradlew --parallel --build-cache :common:test :paper:test :fabric:test :common:jar :paper:jar :fabric:remapJar --console=plain
      - name: Build isolated Paper/Fabric test helpers
        run: |
          ./gradlew --parallel --build-cache \
            -PruntimeAcceptance=true -PruntimeScenario=hyperdog02-main \
            -PruntimeEvidencePhase=HYPER_DOG_PHASE_02 \
            :runtime-test-paper:jar :runtime-test-client:remapJar --console=plain
      - uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Ensure verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Start actual Paper and Fabric, verify 57 rounds and PNGs
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python runtime-test-support/run_hyperdog_phase02.py
      - name: Runtime progress and failure classification
        if: always()
        run: |
          python runtime-test-support/hyperdog_acceptance_diagnostics.py summarize HYPER_DOG_PHASE_02 "$GITHUB_STEP_SUMMARY"
      - name: Upload actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperdog-phase02-real-runtime
          path: |
            runtime-evidence/HYPER_DOG_PHASE_02/result.json
            runtime-evidence/HYPER_DOG_PHASE_02/REPORT.md
            runtime-evidence/HYPER_DOG_PHASE_02/attempts/**
            common/build/test-results/**
            paper/build/test-results/**
            fabric/build/test-results/**
