name: HYPER_DOG Phase 03 normal game real Paper/Fabric

on:
  push:
    branches: [ plan/original-at-machine-20261107 ]
    paths:
      - 'paper/src/main/java/jp/pirijuggler/paper/game/hyperdog/**'
      - 'paper/src/main/java/jp/pirijuggler/paper/machine/MachineType.java'
      - 'paper/src/main/java/jp/pirijuggler/paper/machine/MachineService.java'
      - 'paper/src/test/java/jp/pirijuggler/paper/game/hyperdog/**'
      - 'fabric/src/main/java/jp/pirijuggler/fabric/ui/HyperDogReelPreviewScreen.java'
      - 'runtime-test-support/**'
      - 'original-at-phases/verify_phase03_trace.py'
      - '.github/workflows/hyperdog-phase03-runtime.yml'
  workflow_dispatch:

concurrency:
  group: hyperdog-phase03-normal-runtime
  cancel-in-progress: true

jobs:
  phase03-v5-normal:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Headless Minecraft
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
          chmod +x gradlew
      - name: Compile and execute complete root regression
        run: |
          ./gradlew --parallel --build-cache test :common:jar :paper:jar :fabric:remapJar --console=plain
      - name: Ensure fresh Java trace exists even after Gradle test cache restore
        run: |
          if [ ! -s paper/build/reports/hyperdog-phase03-trace.json ]; then
            ./gradlew :paper:test \
              --tests 'jp.pirijuggler.paper.game.hyperdog.HyperDogNormalGameTest' \
              --rerun-tasks --no-build-cache --console=plain
          fi
          test -s paper/build/reports/hyperdog-phase03-trace.json
      - name: Independently compare seeded Java games against v5 Python oracle
        run: |
          python original-at-phases/verify_phase03_trace.py
      - name: Compile isolated runtime client and server helper JARs
        run: |
          ./gradlew --parallel --build-cache \
            -PruntimeAcceptance=true -PruntimeScenario=hyperdog03-main \
            -PruntimeEvidencePhase=HYPER_DOG_PHASE_03 \
            :runtime-test-paper:jar :runtime-test-client:remapJar --console=plain
      - uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Acquire verified Paper 1.21-130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: 100 normal games on actual Paper/Fabric path
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python runtime-test-support/run_hyperdog_phase03.py
      - name: Persist evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperdog-phase03-v5-normal-runtime
          path: |
            runtime-evidence/HYPER_DOG_PHASE_03/**
            paper/build/reports/hyperdog-phase03-trace.json
            paper/build/test-results/**
            common/build/test-results/**
            fabric/build/test-results/**
