name: SKILL STOP Phase 04 economy and real runtime

concurrency:
  group: skill-stop-phase04-real-runtime
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, skill-stop-phase04 ]
    paths:
      - 'paper/**'
      - 'fabric/**'
      - 'common/**'
      - 'runtime-test-support/**'
      - 'run-skill-stop-phase03-runtime.bat'
      - '.github/workflows/skill-stop-phase03-runtime.yml'
      - 'skill-stop-phases/research/**'
      - '.github/workflows/skill-stop-phase04-runtime.yml'

jobs:
  skill-stop-phase04:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare headless OpenGL display
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
          chmod +x gradlew
      - name: Build production runtime jars
        run: |
          ./gradlew --parallel --build-cache \
            :common:test :paper:test :fabric:test :common:jar :paper:jar :fabric:remapJar --console=plain
      - name: Production economy analysis and independent simulation
        run: |
          ./gradlew :common:exportSkillStopEconomy --console=plain
          SKILL_STOP_PRODUCTION_MODELS=build/skill-stop-production-models.json node skill-stop-phases/research/verify-economy.cjs > build/skill-stop-economy-log.txt
          node skill-stop-phases/research/simulate-production-economy.cjs > build/skill-stop-simulation-log.txt
      - name: Build runtime helper jars
        run: |
          ./gradlew --parallel --build-cache \
            -PruntimeAcceptance=true -PruntimeScenario=skill03-main -PruntimeEvidencePhase=SKILL_STOP_PHASE_03 \
            :runtime-test-paper:jar :runtime-test-client:remapJar --console=plain
      - name: Cache verified Paper 1.21 build 130
        uses: actions/cache@v4
        with:
          path: runtime-evidence/PHASE_01/work/downloads/paper-1.21-130.jar
          key: paper-1.21-build-130-ab9bb1afc3cea6978a0c03ce8448aa654fe8a9c4dddf341e7cbda1b0edaa73f5
      - name: Ensure verified Paper 1.21 build 130
        shell: pwsh
        run: ./runtime-test-support/ensure-paper-1.21-130.ps1
      - name: Real Paper + Fabric SKILL STOP Phase 03 acceptance
        run: xvfb-run -a -s "-screen 0 1280x720x24" python runtime-test-support/run_skill_stop_phase03.py
      - name: Upload SKILL STOP Phase 03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-stop-phase04-runtime-evidence
          path: |
            build/skill-stop-economy-*.json
            build/skill-stop-*-log.txt
            runtime-evidence/SKILL_STOP_PHASE_03/result.json
            runtime-evidence/SKILL_STOP_PHASE_03/attempts/**
            common/build/test-results/**
            paper/build/test-results/**
            fabric/build/test-results/**
            paper/build/libs/piri-juggler-paper-1.0.0.jar
            fabric/build/libs/piri-juggler-fabric-1.0.0.jar
