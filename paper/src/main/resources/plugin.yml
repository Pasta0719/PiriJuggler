name: PiriJuggler
version: '${version}'
main: jp.pirijuggler.paper.PiriJugglerPlugin
api-version: '1.21'
description: Piri Juggler server-authoritative slot foundation
softdepend: [Vault]
commands:
  piri:
    description: Piri Juggler commands
    usage: /piri data [machineId] | /piri prizes | /piri exchange <small|medium|large> [count] | /piri exchange all | /piri recover <status|cashout> | /piri sim <machineId> <games> | /piri machine create|redefine|remove|list|info|setting | /piri key give
  pirimerge:
    description: Merge all valid Piri Medal items in the player inventory into one token
    usage: /pirimerge
  pirireset:
    description: Development reset for an unsettled Piri game snapshot while preserving CREDIT and held medals
    usage: /pirireset [player]
    permission: piri.dev
permissions:
  piri.dev:
    default: op
