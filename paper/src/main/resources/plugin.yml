name: PiriJuggler
version: '${version}'
main: jp.pirijuggler.paper.PiriJugglerPlugin
api-version: '1.21'
description: Server-authoritative slot foundation
softdepend: [Vault]
commands:
  piri:
    description: Slot commands
    usage: /piri recover <status|cashout> | /piri npc <prizes|exchange> <create|remove> | /piri sim <machineId|all> <games> | /piri godtest <id> <reset|normal|gg|god|red7|sgg|gzone|zzone|zgame> | /piri godrole <id> <role|clear> | /piri jgrole <id> <role|clear> | /piri profit <session|total|deposit> | /piri door <secure|normal> | /piri machine create [JUGGLER|JUGGLER_GOD|OKIDOKI|GOD|DISC] | /piri machine type <id> <type> | /piri machine redefine|remove|list|info|setting | /piri key give
  piribuildinfo:
    description: Show the exact loaded build identity
    usage: /piribuildinfo
  pirimerge:
    description: Administrative manual medal merge fallback
    usage: /pirimerge
    permission: piri.dev
  pirireset:
    description: Development reset for an unsettled game snapshot while preserving CREDIT and held medals
    usage: /pirireset [player]
    permission: piri.dev
permissions:
  piri.dev:
    default: op
