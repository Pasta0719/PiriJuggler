name: PiriJuggler
version: '${version}'
main: jp.pirijuggler.paper.PiriJugglerPlugin
api-version: '1.21'
description: Piri Juggler server-authoritative slot foundation
softdepend: [Vault]
commands:
  piri:
    description: Piri machine and session management
    usage: /piri machine create|redefine|remove|list|info or /piri key give
  pirimerge:
    description: Merge all valid Piri Medal items in the player inventory into one token
    usage: /pirimerge
