name: PiriJuggler
version: '${version}'
main: jp.pirijuggler.paper.PiriJugglerPlugin
api-version: '1.21'
description: Server-authoritative slot foundation
softdepend: [Vault]
commands:
  piri:
    description: Slot commands
    usage: /piri recover <status|cashout> | /piri npc <prizes|exchange> <create|remove> | /piri sim <machineId|all> <games> | /piri profit <session|total|deposit> | /piri machine create|redefine|remove|list|info|setting | /piri key give
  piribuildinfo:
    description: Show the exact loaded build identity
    usage: /piribuildinfo
  pirimerge:
    description: Administrative manual medal merge fallback
    usage: /pirimerge
    permission: piri.dev
  pirireset:
    description: Development reset for an unsettled game snapshot while preserving CREDIT and held medals
    usage: /pirireset [player]
    permission: piri.dev
permissions:
  piri.dev:
    default: op
